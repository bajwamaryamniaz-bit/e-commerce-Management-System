<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - E-Commerce DBMS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #182538 0%, #101827 70%);
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-slate-navy);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .brand-logo-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .demo-credentials-box {
      margin-top: 24px;
      padding: 14px 16px;
      background-color: rgba(20, 184, 166, 0.08);
      border: 1px dashed rgba(20, 184, 166, 0.35);
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand-logo-center">
      <div class="sidebar-brand-icon" style="width: 48px; height: 48px; font-size: 1.5rem; margin-bottom: 12px;">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <h2 style="font-size: 1.4rem; font-weight: 700; color: var(--text-main);">E-Commerce System</h2>
      <p style="font-size: 0.85rem; color: var(--teal-primary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px;">
        DBMS Management Portal
      </p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <div style="position: relative;">
          <input type="text" id="username" class="form-control" value="admin" required placeholder="admin or admin@ecommerce.com" style="padding-left: 38px;">
          <i class="fa-solid fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group" style="margin-top: 16px;">
        <label class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-control" value="admin123" required placeholder="••••••••" style="padding-left: 38px;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 20px; font-size: 0.95rem;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
      </button>

      <div class="demo-credentials-box">
        <div style="font-weight: 700; color: var(--teal-primary); margin-bottom: 4px;">
          <i class="fa-solid fa-key"></i> Default Project Credentials:
        </div>
        <div>Username: <strong>admin</strong> | Password: <strong>admin123</strong></div>
        <div style="margin-top: 4px; font-size: 0.75rem; color: var(--text-muted);">
          Stored securely in PostgreSQL with cryptographic hashing.
        </div>
      </div>
    </form>
  </div>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const res = await API.login(user, pass);
        if (res.success) {
          showToast('Login successful! Redirecting...', 'success');
          localStorage.setItem('currentUser', JSON.stringify(res.user));
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        } else {
          showToast(res.message || 'Login failed', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard';
        }
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard';
      }
    }
  </script>
</body>
</html>
